<section id="jeopardy-view" class="viewport-above-scoreboard">
  <div id="jeopardy-board-view">
    <header class="game-header">
      <a class="back-to-hub" href="#/hub" aria-label="Zurück zur Spielauswahl">←</a>
      <h1 id="jeopardy-title"></h1>
      <button id="jeopardy-rules-button" class="game-rules-button" type="button">Regeln anzeigen</button>
    </header>
    <div id="board" aria-label="Jeopardy-Spielbrett"></div>
  </div>
  <div id="jeopardy-question-view" hidden>
    <a class="back-to-hub floating-back" href="#/hub" aria-label="Zurück zur Spielauswahl">←</a>
    <div id="question-layout">
      <div id="card-content">
        <div id="question-value" aria-label="Möglicher Punktegewinn oder -verlust"></div>
        <div id="question-content" class="media-block"></div>
        <div id="answer-content" class="media-block answer" hidden></div>
        <section id="audio-controls" aria-label="Audiosteuerung" hidden>
          <h2>Beamer-Audio</h2>
          <div id="audio-tracks"></div>
          <p id="audio-status" role="status">Bereit</p>
        </section>
      </div>
      <aside id="buzzer-panel" aria-label="Buzzer-Reihenfolge">
        <div class="buzzer-panel-heading">
          <div>
            <span class="buzzer-kicker">Jeopardy</span>
            <h2>Buzzer</h2>
          </div>
          <span id="buzzer-connection" title="Verbindungsstatus der Buzzer">Verbindung wird hergestellt…</span>
        </div>
        <p id="buzzer-host-status" role="status" aria-live="polite">Gebt die Buzzer frei, sobald die Spieler bereit sind.</p>
        <div id="buzzer-active" hidden>
          <span>Antwortet jetzt</span>
          <strong id="buzzer-active-team"></strong>
          <button id="buzzer-active-remove" class="buzz-remove-button" type="button"></button>
        </div>
        <div id="buzzer-empty">
          <span class="buzzer-empty-icon" aria-hidden="true">!</span>
          <strong>Noch niemand gebuzzert</strong>
          <span id="buzzer-empty-detail">Der Buzzer ist noch geschlossen.</span>
        </div>
        <section class="buzzer-queue" aria-labelledby="buzzer-queue-title">
          <div class="buzzer-queue-heading">
            <h3 id="buzzer-queue-title">Warteschlange</h3>
            <span id="buzzer-queue-count">0 Teams</span>
          </div>
          <ol id="buzz-order"></ol>
        </section>
        <button id="buzzer-control-button" type="button">Buzzer freigeben</button>
      </aside>
    </div>
    <div id="question-controls">
      <button id="reveal-button" type="button">Antwort anzeigen</button>
      <button id="continue-button" type="button">Weiter →</button>
    </div>
  </div>
</section>
