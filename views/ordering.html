<section id="ordering-view" class="viewport-above-scoreboard">
  <a class="back-to-hub floating-back" href="#/hub" aria-label="Zurück zur Spielauswahl">←</a>
  <div class="ordering-shell">
    <header class="ordering-heading">
      <h1>Order Up</h1>
      <p id="ordering-status" aria-live="polite"></p>
    </header>
    <main id="ordering-content"></main>
  </div>
  <dialog id="ordering-cancel-dialog">
    <h2>Diese Runde abbrechen?</h2>
    <p>Alle für diese Frage eingereichten Reihenfolgen werden verworfen.</p>
    <form method="dialog" class="ordering-actions">
      <button value="keep" class="secondary-button">Runde fortsetzen</button>
      <button value="cancel" class="danger-button">Runde abbrechen</button>
    </form>
  </dialog>
</section>
