<section id="setup-view" class="status-screen">
  <div class="panel">
    <img
      class="setup-logo"
      src="assets/Logo-480.webp"
      srcset="assets/Logo-480.webp 480w, assets/Logo-1024.webp 1024w"
      sizes="(max-width: 600px) 72vw, 18rem"
      alt=""
      aria-hidden="true"
    >
    <h1 id="setup-title"></h1>
    <p>Heute spielen:</p>
    <ul id="team-editors"></ul>
    <button id="add-team-button" type="button">+ Team hinzufügen</button>
    <p id="setup-message"></p>
    <div class="setup-actions">
      <button id="start-button" class="primary-button" type="button">Starten</button>
      <button id="resume-button" class="primary-button" type="button" hidden>Spiel fortsetzen</button>
      <button id="new-game-button" class="secondary-button" type="button" hidden>Neues Spiel</button>
    </div>
    <p><small>Drückt F11 für den Vollbildmodus.</small></p>
  </div>
</section>
