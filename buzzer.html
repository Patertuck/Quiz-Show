<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111d65">
  <title>Quiz Buzzer</title>
  <link rel="stylesheet" href="styles/buzzer.css">
</head>
<body>
  <main class="buzzer-app">
    <header>
      <h1>Quiz Buzzer</h1>
      <span id="connection-status" class="connection-status">Connecting…</span>
    </header>
    <section id="team-step" class="buzzer-card">
      <h2>Choose your team</h2>
      <div id="team-choices" class="team-choices"></div>
    </section>
    <section id="buzz-step" class="buzzer-card" hidden>
      <div class="selected-team-row">
        <strong id="selected-team"></strong>
        <button id="change-team" type="button">Change</button>
      </div>
      <button id="buzz-button" class="buzz-button" type="button" disabled>Waiting for host</button>
      <p id="buzz-status" class="buzz-status" role="status" aria-live="polite">The host has not opened the buzzers yet.</p>
    </section>
  </main>
  <script type="module" src="js/buzzer.js"></script>
</body>
</html>
