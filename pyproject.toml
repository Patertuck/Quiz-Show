[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-quizshow"
version = "0.1.0"
description = "Quizzy, a locally hosted quiz game for a host, players, and an audience display."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "quiz-data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["quizshow*"]
