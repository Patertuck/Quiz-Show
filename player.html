<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111d65">
  <title>Quizspieler</title>
  <link rel="stylesheet" href="styles/player.css">
</head>
<body>
  <main class="player-app">
    <header>
      <h1>Quizspieler</h1>
      <span id="connection-status" class="connection-status">Verbindung wird hergestellt…</span>
    </header>
    <section id="waiting-step" class="player-card waiting-player">
      <img
        class="player-waiting-logo"
        src="assets/Logo-480.webp"
        srcset="assets/Logo-480.webp 480w, assets/Logo-1024.webp 1024w"
        sizes="(max-width: 34rem) 72vw, 24rem"
        alt=""
        aria-hidden="true"
      >
      <div id="waiting-team-row" class="selected-team-row" hidden>
        <strong id="waiting-team"></strong>
        <button id="waiting-change-team" type="button">Wechseln</button>
      </div>
      <h2 id="waiting-title">Warten auf ein Spiel</h2>
      <p id="waiting-status" role="status" aria-live="polite">Die Spielleitung hat noch kein Spiel gestartet. Lasst diese Seite geöffnet.</p>
    </section>
    <section id="team-step" class="player-card" hidden>
      <h2>Wählt euer Team</h2>
      <div id="team-choices" class="team-choices"></div>
    </section>
    <section id="buzz-step" class="player-card" hidden>
      <div class="selected-team-row">
        <strong id="selected-team"></strong>
        <button id="change-team" type="button">Wechseln</button>
      </div>
      <button id="buzz-button" class="buzz-button" type="button" disabled>Warten</button>
      <p id="buzz-status" class="buzz-status" role="status" aria-live="polite">Die Spielleitung hat die Buzzer noch nicht freigegeben.</p>
    </section>
    <section id="ordering-step" class="player-card ordering-phone" hidden>
      <div class="selected-team-row">
        <strong id="ordering-team"></strong>
        <button id="ordering-change-team" type="button">Wechseln</button>
      </div>
      <h2 id="ordering-title">Order Up</h2>
      <p id="ordering-prompt"></p>
      <output id="ordering-countdown" aria-label="Verbleibende Sekunden"></output>
      <ol id="ordering-list" class="ordering-phone-list"></ol>
      <p id="ordering-phone-status" class="buzz-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="js/player.js"></script>
</body>
</html>
