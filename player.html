<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111d65">
  <title>Quiz Player</title>
  <link rel="stylesheet" href="styles/player.css?v=1">
</head>
<body>
  <main class="player-app">
    <header>
      <h1>Quiz Player</h1>
      <span id="connection-status" class="connection-status">Connecting…</span>
    </header>
    <section id="waiting-step" class="player-card waiting-player">
      <img
        class="player-waiting-logo"
        src="assets/Logo-480.webp"
        srcset="assets/Logo-480.webp 480w, assets/Logo-1024.webp 1024w"
        sizes="(max-width: 34rem) 72vw, 24rem"
        alt=""
        aria-hidden="true"
      >
      <h2>Waiting for a game</h2>
      <p id="waiting-status" role="status" aria-live="polite">The host has not started a game yet. Keep this page open.</p>
    </section>
    <section id="team-step" class="player-card" hidden>
      <h2>Choose your team</h2>
      <div id="team-choices" class="team-choices"></div>
    </section>
    <section id="buzz-step" class="player-card" hidden>
      <div class="selected-team-row">
        <strong id="selected-team"></strong>
        <button id="change-team" type="button">Change</button>
      </div>
      <button id="buzz-button" class="buzz-button" type="button" disabled>Waiting for host</button>
      <p id="buzz-status" class="buzz-status" role="status" aria-live="polite">The host has not opened the buzzers yet.</p>
    </section>
    <section id="ordering-step" class="player-card ordering-phone" hidden>
      <div class="selected-team-row">
        <strong id="ordering-team"></strong>
        <button id="ordering-change-team" type="button">Change</button>
      </div>
      <h2 id="ordering-title">Put It in Order</h2>
      <p id="ordering-prompt"></p>
      <output id="ordering-countdown" aria-label="Seconds remaining"></output>
      <ol id="ordering-list" class="ordering-phone-list"></ol>
      <p id="ordering-phone-status" class="buzz-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="js/player.js?v=1"></script>
</body>
</html>
